<button type="button" onclick="toggleTheme()" title="Basculer mode clair/sombre"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-300 hover:text-white hover:bg-white/10 transition-colors flex-shrink-0">
  <i class="ti ti-moon-stars text-lg theme-icon-dark" style="display:none;"></i>
  <i class="ti ti-sun text-lg theme-icon-light"></i>
</button>

<script>
  if (!window.toggleTheme) {
    window.toggleTheme = function() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
      document.querySelectorAll('.theme-icon-dark, .theme-icon-light').forEach(function(el) {
        el.style.display = 'none';
      });
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelectorAll(dark ? '.theme-icon-dark' : '.theme-icon-light').forEach(function(el) {
        el.style.display = '';
      });
    };
    document.addEventListener('DOMContentLoaded', function() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelectorAll(dark ? '.theme-icon-dark' : '.theme-icon-light').forEach(function(el) {
        el.style.display = '';
      });
    });
  }
</script>
