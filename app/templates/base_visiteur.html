<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Espace visiteur{% endblock %} — Portail Socrate</title>
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="h-full bg-gray-50">

  <header class="bg-loge-900 text-white">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-xl">⚜</span>
        <div class="min-w-0">
          <div class="text-sm font-semibold truncate">Portail Socrate</div>
          <div class="text-[11px] text-amber-300 font-medium truncate">
            <i class="ti ti-user-exclamation"></i>
            Frère visiteur{% if guest.home_lodge %} — {{ guest.home_lodge }}{% endif %}
          </div>
        </div>
      </div>
      <form method="post" action="/auth/logout">
        <button type="submit" class="text-xs text-slate-300 hover:text-white underline">Déconnexion</button>
      </form>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
