{% extends "base.html" %}
{% block title %}Modifier le message — Forum{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">

  <div class="flex items-center gap-3 mb-6">
    <a href="/forum/t/{{ msg.subject_id }}#m-{{ msg.id }}" class="text-gray-400 hover:text-gray-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
      </svg>
    </a>
    <h1 class="text-xl font-bold text-gray-900">Modifier le message</h1>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
    <form method="post" action="/forum/messages/{{ msg.id }}/edit" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Message</label>
        <textarea name="content" rows="8" required
                  class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-loge-500 resize-none">{{ msg.content_html }}</textarea>
      </div>

      <div class="flex gap-3 pt-2">
        <a href="/forum/t/{{ msg.subject_id }}#m-{{ msg.id }}"
           class="flex-1 text-center border border-gray-200 text-gray-600 text-sm font-medium py-2.5 rounded-xl hover:bg-gray-50 transition-colors">
          Annuler
        </a>
        <button type="submit"
                class="flex-1 bg-loge-700 hover:bg-loge-800 text-white text-sm font-semibold py-2.5 rounded-xl transition-colors">
          Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
