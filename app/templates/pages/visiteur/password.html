{% extends "base_visiteur.html" %}
{% block title %}Mot de passe{% endblock %}

{% block content %}
<div class="space-y-5">

  <a href="/visiteur/" class="text-sm text-gray-500 hover:text-gray-700">← Accueil</a>
  <h1 class="text-xl font-bold text-gray-900">Changer mon mot de passe</h1>

  {% if success %}
  <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-700 text-sm">
    Mot de passe mis à jour.
  </div>
  {% endif %}
  {% if error %}
  <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{{ error }}</div>
  {% endif %}

  <form method="post" action="/visiteur/mot-de-passe" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe actuel</label>
      <input type="password" name="current_password" required autocomplete="current-password"
             class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-loge-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Nouveau mot de passe</label>
      <input type="password" name="new_password" required minlength="8" autocomplete="new-password"
             class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-loge-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirmer le nouveau mot de passe</label>
      <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"
             class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-loge-500">
    </div>
    <button type="submit" class="w-full py-2.5 bg-loge-700 hover:bg-loge-800 text-white font-medium rounded-lg text-sm transition-colors">
      Mettre à jour
    </button>
  </form>

</div>
{% endblock %}
